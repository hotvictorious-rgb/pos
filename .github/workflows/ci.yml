name: CI Test Suite

on:
  push:
    branches: [ "main", "feat/**", "feature/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  statuses: write
  checks: write

jobs:
  laravel-tests:
    name: "Laravel Tests (PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite3, pdo_sqlite, bcmath
        coverage: none

    - name: Setup Environment & SQLite Database
      run: |
        cp .env.example .env
        sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
        sed -i 's/DB_DATABASE=hysam/DB_DATABASE=database\/database.sqlite/' .env
        sed -i 's/SUPER_ADMIN_PASSWORD=.*/SUPER_ADMIN_PASSWORD="CI_SQLite_SecureRootPassword#2026"/' .env
        mkdir -p database
        touch database/database.sqlite

    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Execute Automated Test Suite
      id: test_suite
      run: |
        php artisan test --colors=never | tee test_run.log
        echo "### Automated Test Suite Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat test_run.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload Test Results Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test_run.log
        retention-days: 7

    - name: Publish GitHub Commit Status
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          try {
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const description = state === 'success' ? 'All CI automated tests passed' : 'CI automated tests failed';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: description,
              context: 'ci/laravel-tests'
            });
          } catch (error) {
            core.info(`Commit status publishing skipped (permissions): ${error.message}`);
          }

  mysql-tests:
    name: "MySQL 8.0 & Root Provisioning CI"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hysam_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, mysql, pdo_mysql, bcmath
        coverage: none

    - name: Setup Environment for MySQL
      run: |
        cp .env.example .env
        sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
        sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
        sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
        sed -i 's/DB_DATABASE=.*/DB_DATABASE=hysam_test/' .env
        sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
        sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env
        sed -i 's/SUPER_ADMIN_PASSWORD=.*/SUPER_ADMIN_PASSWORD="CI_MySQL_SecureRootPassword#2026"/' .env

    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Run Migrations on MySQL 8.0
      run: php artisan migrate:fresh --force

    - name: Run Dedicated Root Provisioning on MySQL 8.0
      run: php artisan saas:provision-root --force --password="CI_MySQL_SecureRootPassword#2026"

    - name: Execute Full Automated Test Suite on MySQL 8.0
      id: mysql_test_suite
      run: |
        php artisan test --configuration=phpunit.mysql.xml --colors=never | tee mysql_test_run.log
        echo "### MySQL 8.0 Automated Test Suite Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat mysql_test_run.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload MySQL Test Results Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mysql-test-results
        path: mysql_test_run.log
        retention-days: 7

    - name: Publish GitHub MySQL Commit Status
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          try {
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const description = state === 'success' ? 'MySQL 8.0 CI & provisioning tests passed' : 'MySQL 8.0 CI tests failed';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: description,
              context: 'ci/mysql-8.0-tests'
            });
          } catch (error) {
            core.info(`Commit status publishing skipped (permissions): ${error.message}`);
          }

  frontend-build:
    name: "Frontend Build & Lint (Node 22)"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install NPM Dependencies
      run: npm ci

    - name: TypeScript Lint & Typecheck
      run: npm run lint

    - name: Build Frontend Assets
      run: npm run build

    - name: Publish Frontend Commit Status
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          try {
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const description = state === 'success' ? 'Frontend build and typecheck passed' : 'Frontend build/typecheck failed';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: description,
              context: 'ci/frontend-build'
            });
          } catch (error) {
            core.info(`Commit status publishing skipped (permissions): ${error.message}`);
          }


