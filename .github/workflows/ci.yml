name: CI Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  statuses: write
  checks: write

jobs:
  laravel-tests:
    name: "Laravel Tests (PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite3, pdo_sqlite, bcmath
        coverage: none

    - name: Setup Environment & SQLite Database
      run: |
        cp .env.example .env
        sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
        sed -i 's/DB_DATABASE=hysam/DB_DATABASE=database\/database.sqlite/' .env
        mkdir -p database
        touch database/database.sqlite

    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Execute Automated Test Suite
      id: test_suite
      run: |
        php artisan test --colors=never | tee test_run.log
        echo "### Automated Test Suite Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat test_run.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload Test Results Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test_run.log
        retention-days: 7

    - name: Publish GitHub Commit Status
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          try {
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const description = state === 'success' ? 'All CI automated tests passed' : 'CI automated tests failed';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: description,
              context: 'ci/laravel-tests'
            });
          } catch (error) {
            core.info(`Commit status publishing skipped (permissions): ${error.message}`);
          }
